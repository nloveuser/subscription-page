events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    resolver 1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 208.67.222.222 208.67.220.220;

    acme_client acme_le https://acme-v02.api.letsencrypt.org/directory;

    upstream rwsp_backend {
        server remnawave-subscription-page:3010;
        keepalive 32;
    }

    # Reject unknown SSL handshakes (no matching server_name)
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    # HTTP: Angie handles ACME HTTP-01 challenge internally
    # All other HTTP traffic gets dropped
    server {
        listen 80;
        return 444; # https://angie.software/angie/docs/configuration/acme/#http
    }

    # Per-domain HTTPS configs — written by Go API on POST /api/domains
    include /etc/angie/conf.d/domains/*.conf;
}
